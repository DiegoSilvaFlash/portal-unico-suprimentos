<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Único Suprimentos</title>
<meta name="description" content="Portal único de solicitações de Suprimentos do Grupo Flash, com dados no SharePoint.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra de navegação superior com abas; conteúdo em coluna única de até 1180px; detalhe abre em painel lateral */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#16202c; --muted:#5a6676; --line:#dbe1e8;
  --brand:#1e3c62; --brand-ink:#ffffff; --accent:#d9730f; --accent-soft:#fbeadb;
  --ok:#1d8457; --ok-soft:#dff3ea; --warn:#a86a12; --warn-soft:#fbf0dc; --crit:#bf3d2b; --crit-soft:#fbe4df; --info:#2a68ad; --info-soft:#e1ecf8;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px; --shadow:0 8px 30px rgba(20,32,48,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --ink:#e5eaf1; --muted:#98a4b4; --line:#283343;
  --brand:#8db2e2; --brand-ink:#0e131a; --accent:#f0953a; --accent-soft:#3a2a19;
  --ok:#4fc28d; --ok-soft:#173327; --warn:#e2b04c; --warn-soft:#352c17; --crit:#ef7b67; --crit-soft:#3a1f1b; --info:#6ea8ea; --info-soft:#18283c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --ink:#e5eaf1; --muted:#98a4b4; --line:#283343;
  --brand:#8db2e2; --brand-ink:#0e131a; --accent:#f0953a; --accent-soft:#3a2a19;
  --ok:#4fc28d; --ok-soft:#173327; --warn:#e2b04c; --warn-soft:#352c17; --crit:#ef7b67; --crit-soft:#3a1f1b; --info:#6ea8ea; --info-soft:#18283c;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.1}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner .wrap{padding-block:7px}

main{padding-block:24px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:24px;letter-spacing:-.015em}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* stepper */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:13px}
.steps .s{display:flex;align-items:center;gap:6px;color:var(--muted)}
.steps .s i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;font-weight:600}
.steps .s.on{color:var(--ink);font-weight:600}
.steps .s.on i{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps .s.done i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.steps .sep{width:24px;height:1px;background:var(--line)}
.steps button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;display:flex;align-items:center;gap:6px}

/* area grid */
.grid-areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.area-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:128px;position:relative;overflow:hidden}
.area-card:hover{border-color:var(--c,var(--brand));box-shadow:0 2px 0 var(--c,var(--brand)) inset}
.area-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.area-ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--brand)) 13%,transparent);color:var(--c,var(--brand));transition:transform .15s}
.area-ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.area-card:hover .area-ico{transform:scale(1.06)}
.ico-pick{display:flex;gap:6px;flex-wrap:wrap}
.ico-pick label{border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.ico-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ico-pick input{position:absolute;opacity:0;pointer-events:none}
.ico-pick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.area-card .sig{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 12%,transparent);padding:2px 7px;border-radius:4px;align-self:flex-start}
.area-card h3{font-size:16px}
.area-card p{margin:0;color:var(--muted);font-size:13px}
.area-card .meta{margin-top:auto;font-size:12px;color:var(--muted)}

.guia{display:grid;gap:18px;max-width:880px}
.guia-trail{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.guia-trail button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.guia-trail button:hover{color:var(--ink);border-color:var(--muted)}
.guia-trail .arr{color:var(--muted)}
.guia-q{font-family:var(--f-display);font-size:26px;letter-spacing:-.015em;line-height:1.2;margin:0;text-wrap:balance}
.guia-h{color:var(--muted);margin:4px 0 0;max-width:60ch}
.guia-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.guia-opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;align-items:start;transition:border-color .12s,transform .12s}
.guia-opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.guia-opt .k{grid-row:span 2;width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
.guia-opt b{font-size:15px}
.guia-opt span.d{color:var(--muted);font-size:13px}
.guia-opt.leaf .k{background:var(--ok-soft);color:var(--ok)}
.guia-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.via-guia{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.via-guia button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
.type-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.type-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.type-card:hover{border-color:var(--accent)}
.type-card b{font-size:15px}
.type-card p{margin:0;color:var(--muted);font-size:13px}
.type-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.portal{background:var(--info-soft);color:var(--info)}
.chip.sla{background:var(--surface-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* form */
.form-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:860px){.form-shell{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:16px;margin-bottom:4px}
.fieldset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:14px}
@media (max-width:560px){.fieldset{grid-template-columns:1fr}}
.f{display:grid;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:500}
.f label .req{color:var(--crit);margin-left:2px}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--crit)}
.f .errmsg{color:var(--crit);font-size:12px}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0 4px}
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px;align-items:start}
.est .col{display:grid;gap:6px;min-width:0}
@media (max-width:560px){.est{grid-template-columns:1fr}}
.grp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:12px}
.grp-list .g{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 10px;font-size:13px}
.grp-list .g span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{font-size:12.5px;margin-top:10px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:18px}
.radio-row{display:flex;gap:6px;flex-wrap:wrap}
.radio-row label{border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px}
.radio-row input{position:absolute;opacity:0;pointer-events:none}
.radio-row input:checked + span{color:var(--accent)}
.radio-row label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-row label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.summary dl{margin:12px 0 0;display:grid;gap:10px}
.summary dt{font-size:12px;color:var(--muted)}
.summary dd{margin:0;font-weight:500}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:0;flex:1 1 150px;max-width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .t{font-weight:500}
td .s{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-nova{background:var(--info-soft);color:var(--info)}
.st-triagem,.st-aguardando{background:var(--warn-soft);color:var(--warn)}
.st-encaminhada,.st-andamento{background:var(--accent-soft);color:var(--accent)}
.st-concluida{background:var(--ok-soft);color:var(--ok)}
.st-cancelada{background:var(--surface-2);color:var(--muted)}
.prio{font-size:12px;font-weight:600}
.prio-Urgente{color:var(--crit)} .prio-Alta{color:var(--warn)} .prio-Média{color:var(--ink)} .prio-Baixa{color:var(--muted)}
.late{color:var(--crit);font-weight:600}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:52ch}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .v.crit{color:var(--crit)}
.kpi .d{font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.dash{grid-template-columns:1fr}}
.bars{display:grid;gap:9px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.accent i{background:var(--accent)}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{font-size:18px}
.drawer .body{overflow:auto;padding:18px 20px;display:grid;gap:18px;align-content:start}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.timeline{display:grid;gap:12px;margin:10px 0 0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;font-size:13px}
.timeline li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px}
.timeline li.st::before{background:var(--accent)}
.timeline .w{color:var(--muted);font-size:12px}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--f-mono);font-size:12px;overflow:auto;max-height:280px;margin:8px 0 0;white-space:pre}

/* catalog */
.cat{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cat{grid-template-columns:1fr}}
.cat-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat-list button.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;text-align:left;cursor:pointer}
.cat-list button.item:hover{background:var(--surface-2)}
.cat-list button.item[aria-current="true"]{background:var(--surface-2);box-shadow:3px 0 0 var(--accent) inset;font-weight:600}
.cat-list .foot{padding:10px}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.fields-table{width:100%;min-width:640px}
.fields-table td,.fields-table th{padding:6px 8px;cursor:default}
.fields-table tbody tr:hover td{background:none}
.fields-table input,.fields-table select{padding:6px 8px}
.type-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.type-row:last-child{border-bottom:0}
.portal-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;margin-top:8px}
@media (max-width:700px){.portal-row{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}
.success{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 20px}
.success .proto{font-family:var(--f-mono);font-size:22px;color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.int-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:18px}
.big{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
#sp-login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
#sp-login .sp-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;max-width:420px;text-align:center;display:grid;gap:12px;justify-items:center}
#sp-login .sp-mark{width:48px;height:48px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:20px}

<script>
/* ===================== CONFIGURAÇÃO (copiar da Gestão de Férias) ===================== */
/* Mesmo login da Gestão de Férias / Gestão de Demandas: sem depender da TI. No GitHub Pages o login abre
   uma janela (popup) que retorna pelo endereço já autorizado no Azure AD (o do Plano de Ação RH e Operação). */
const USAR_REDIRECT_PROPRIO = false;
const PORTAL_CONFIG = {
  clientId:   "c7a8fe93-1bdf-4739-94d0-626d884a605c",
  tenantId:   "9cc5e35a-c64c-4450-ae6d-9bf065f73c61",
  authority:  "https://login.microsoftonline.com/9cc5e35a-c64c-4450-ae6d-9bf065f73c61",
  redirectUri: (location.hostname === "diegosilvaflash.github.io" && !USAR_REDIRECT_PROPRIO) ? "https://diegosilvaflash.github.io/plano-acao-rh-operacao/" : location.origin + location.pathname,
  scopes:     ["User.Read", "Files.ReadWrite", "Sites.ReadWrite.All"],
  spHost:     "flashcouriercombr.sharepoint.com",
  sitePath:   "/sites/SUPRIMENTOS_NEW",
  biblioteca: "Documentos",
  pasta:      "CSC - SUPRIMENTOS/GERENCIAL/INDICADORES/DIÁRIA/Portal_Unico",
  arquivos:   { catalogo: "portal-catalogo.json", solicitacoes: "portal-solicitacoes.json" },
  admins:     ["diego.silva@flashcourier.com.br"],
  atualizarSegundos: 30
};
/* ===================================================================================== */

(function(){
  const GRAPH = "https://graph.microsoft.com/v1.0";
  const C = PORTAL_CONFIG;
  let msalApp = null, account = null, driveId = null;

  function authority(){ return C.authority || ("https://login.microsoftonline.com/" + C.tenantId); }
  async function token(){
    const req = { scopes: C.scopes, account };
    try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
    catch(e){ try { return (await msalApp.acquireTokenPopup(req)).accessToken; } catch(e2){ throw new Error("Sessão expirada. Recarregue a página e entre novamente."); } }
  }
  async function g(url, opts={}){
    const t = await token();
    const r = await fetch(url.startsWith("http") ? url : GRAPH + url, { ...opts, headers: { Authorization: "Bearer " + t, ...(opts.headers||{}) } });
    return r;
  }
  async function resolveDrive(){
    if (driveId) return driveId;
    const s = await g(`/sites/${C.spHost}:${C.sitePath}`);
    if (!s.ok) throw new Error("Não encontrei o site do SharePoint (" + s.status + ")");
    const site = await s.json();
    const d = await g(`/sites/${site.id}/drive`);
    if (!d.ok) throw new Error("Biblioteca de documentos não encontrada (" + d.status + ")");
    driveId = (await d.json()).id; return driveId;
  }
  const filePath = key => (C.pasta + "/" + C.arquivos[key]).split("/").map(encodeURIComponent).join("/");
  async function readFile(key){
    const id = await resolveDrive();
    const r = await g(`/drives/${id}/root:/${filePath(key)}`);
    if (r.status === 404) return { docs: {}, etag: null };
    if (!r.ok) throw new Error("Falha ao ler " + C.arquivos[key] + " (" + r.status + ")");
    const meta = await r.json();
    const c = await fetch(meta["@microsoft.graph.downloadUrl"], { cache: "no-store" });
    const body = await c.json().catch(() => ({ docs: {} }));
    return { docs: body.docs || {}, etag: meta.eTag };
  }
  async function writeFile(key, docs, etag){
    const id = await resolveDrive();
    const url = `/drives/${id}/root:/${filePath(key)}:/content` + (etag ? "" : "?@microsoft.graph.conflictBehavior=fail");
    const headers = { "Content-Type": "application/json" };
    if (etag) headers["If-Match"] = etag;
    const r = await g(url, { method: "PUT", headers, body: JSON.stringify({ docs, salvoEm: new Date().toISOString() }) });
    if (r.status === 412 || r.status === 409) return { conflito: true };
    if (!r.ok) { const e = new Error("Falha ao salvar (" + r.status + ")"); e.code = r.status === 403 ? "invalid_argument" : "unavailable"; throw e; }
    const meta = await r.json(); return { etag: meta.eTag };
  }

  /* ---- banco em memória com a mesma API que o portal já usa ---- */
  const cache = { catalogo: { docs: {}, etag: null }, solicitacoes: { docs: {}, etag: null } };
  const listeners = new Set();
  const route = path => path.startsWith("config") ? "catalogo" : "solicitacoes";
  const isChild = (col, p) => p.startsWith(col + "/") && !p.slice(col.length + 1).includes("/");
  const merge = (a, b) => { const o = { ...(a||{}) }; for (const k in b) { const v = b[k]; o[k] = (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) ? merge(o[k], v) : v; } return o; };
  const snapDoc = (path) => { const d = cache[route(path)].docs[path]; const id = path.split("/").pop(); return { id, exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined, metadata: { fromCache: false, hasPendingWrites: false } }; };
  function snapCol(q){
    let ids = Object.keys(cache[route(q.path)].docs).filter(p => isChild(q.path, p));
    let docs = ids.map(snapDoc);
    if (q.order) { const [f, dir] = q.order; docs.sort((a, b) => { const x = (a.data()||{})[f] ?? "", y = (b.data()||{})[f] ?? ""; return (x < y ? -1 : x > y ? 1 : 0) * (dir === "desc" ? -1 : 1); }); }
    else docs.sort((a, b) => a.id < b.id ? -1 : 1);
    if (q.lim) docs = docs.slice(0, q.lim);
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function notify(){ listeners.forEach(l => { try { l.kind === "doc" ? l.next(snapDoc(l.path)) : l.next(snapCol(l.q)); } catch(e){ console.error(e); } }); }
  async function mutate(key, fn){
    for (let i = 0; i < 4; i++) {
      const cur = await readFile(key);
      const docs = JSON.parse(JSON.stringify(cur.docs));
      fn(docs);
      const res = await writeFile(key, docs, cur.etag);
      if (res.conflito) { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); continue; }
      cache[key] = { docs, etag: res.etag }; notify(); return;
    }
    const e = new Error("Outra pessoa salvou ao mesmo tempo. Tente de novo."); e.code = "unavailable"; throw e;
  }
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function docRef(path){
    return {
      id: path.split("/").pop(), path,
      get: async () => snapDoc(path),
      set: data => mutate(route(path), d => { d[path] = JSON.parse(JSON.stringify(data)); }),
      update: data => mutate(route(path), d => { if (!d[path]) { const e = new Error("não existe"); e.code = "invalid_argument"; throw e; } d[path] = merge(d[path], data); }),
      delete: () => mutate(route(path), d => { delete d[path]; Object.keys(d).forEach(p => { if (p.startsWith(path + "/")) delete d[p]; }); }),
      onSnapshot(next){ const l = { kind: "doc", path, next }; listeners.add(l); setTimeout(() => next(snapDoc(path)), 0); return () => listeners.delete(l); },
      collection: sub => colRef(path + "/" + sub)
    };
  }
  function colRef(path, q){
    q = q || { path };
    return {
      path,
      doc: id => docRef(path + "/" + (id || rid())),
      add: async data => { const r = docRef(path + "/" + rid()); await r.set(data); return r; },
      orderBy: (f, dir) => colRef(path, { ...q, order: [f, dir || "asc"] }),
      limit: n => colRef(path, { ...q, lim: n }),
      where: () => colRef(path, q),
      get: async () => snapCol(q),
      onSnapshot(next){ const l = { kind: "col", q, next }; listeners.add(l); setTimeout(() => next(snapCol(q)), 0); return () => listeners.delete(l); }
    };
  }
  async function refresh(){
    for (const key of ["catalogo", "solicitacoes"]) {
      try { const f = await readFile(key); if (f.etag !== cache[key].etag) { cache[key] = f; notify(); } }
      catch(e){ console.warn(e); }
    }
  }

  const nomeDe = email => { const n = String(email||"").split("@")[0].replace(/[._-]+/g, " ").trim(); return n ? n.replace(/\b\w/g, c => c.toUpperCase()) : ""; };

  function loginScreen(msg){
    let el = document.getElementById("sp-login");
    if (!el) { el = document.createElement("div"); el.id = "sp-login"; document.body.appendChild(el); }
    el.innerHTML = `<div class="sp-box"><div class="sp-mark">▶</div><h1>Portal Único Suprimentos</h1><p>${msg || "Entre com sua conta Microsoft da Flash Courier para abrir e acompanhar solicitações."}</p><button id="sp-btn" class="btn primary">Entrar com a Microsoft</button></div>`;
    document.getElementById("sp-btn").onclick = async () => {
      try { const r = await msalApp.loginPopup({ scopes: C.scopes, prompt: "select_account" }); account = r.account; try { msalApp.setActiveAccount(account); } catch(x){} if (window.__spLogado) window.__spLogado(); }
      catch(e){ const p = el.querySelector("p"); p.textContent = /popup_window|blocked/i.test(String(e && (e.errorCode || e.message))) ? "O navegador bloqueou a janela de login. Libere pop-ups para este site e tente de novo." : "Não foi possível entrar: " + (e.errorMessage || e.message || e); }
    };
  }

  function aviso(titulo, texto){
    let el = document.getElementById("sp-login");
    if (!el) { el = document.createElement("div"); el.id = "sp-login"; document.body.appendChild(el); }
    el.innerHTML = `<div class="sp-box"><div class="sp-mark">!</div><h1>${titulo}</h1><p>${texto}</p></div>`;
  }
  window.portalSharePoint = async function(){
    const pend = ["clientId","tenantId","spHost"].filter(k => String(C[k]).startsWith("COLE_") || String(C[k]).includes("COLE_AQUI"));
    if (C.authority) { const i = pend.indexOf("tenantId"); if (i >= 0) pend.splice(i, 1); }
    if (pend.length) { aviso("Configuração pendente", "Preencha no início do index.html, com os mesmos valores da Gestão de Férias: <b>" + pend.join(", ") + "</b>."); return new Promise(() => {}); }
    if (location.protocol === "file:") { aviso("Abra pelo endereço do GitHub", "O login da Microsoft não funciona com o arquivo aberto do computador. Suba o index.html no GitHub e abra pelo endereço <b>diegosilvaflash.github.io/portal-unico-suprimentos</b>."); return new Promise(() => {}); }
    if (!window.msal) throw new Error("Biblioteca de login não carregou");
    msalApp = new msal.PublicClientApplication({ auth: { clientId: C.clientId, authority: authority(), redirectUri: C.redirectUri }, cache: { cacheLocation: "localStorage" } });
    if (msalApp.initialize) await msalApp.initialize();
    const res = await msalApp.handleRedirectPromise().catch(e => { console.error(e); return null; });
    account = (res && res.account) || msalApp.getAllAccounts()[0] || null;
    if (!account) { loginScreen(); await new Promise(res => { window.__spLogado = res; }); }
    msalApp.setActiveAccount && msalApp.setActiveAccount(account);
    const el = document.getElementById("sp-login"); if (el) el.remove();
    await refresh();
    if (!cache.catalogo.etag && window.PORTAL_SEED) { try { const w = await writeFile("catalogo", window.PORTAL_SEED.docs, null); if (w.etag) { cache.catalogo = { docs: JSON.parse(JSON.stringify(window.PORTAL_SEED.docs)), etag: w.etag }; } else await refresh(); } catch(e){ console.error(e); throw new Error("Não consegui criar o catálogo no SharePoint: " + e.message); } }
    setInterval(refresh, (C.atualizarSegundos || 30) * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    const email = (account.username || "").toLowerCase();
    const admin = C.admins.map(x => x.toLowerCase()).includes(email);
    const nomes = {}; nomes[email] = account.name || nomeDe(email);
    const user = {
      me: async () => ({ id: email, name: account.name || nomeDe(email), email, isOwner: admin, canEdit: admin }),
      id: async () => email, canEdit: async () => admin, isOwner: async () => admin, can: async () => true,
      profiles: async ids => { const o = {}; (Array.isArray(ids) ? ids : [ids]).forEach(id => o[id] = { id, name: nomes[id] || nomeDe(id) }); return o; }
    };
    const db = { doc: docRef, collection: p => colRef(p) };
    const downloads = { save: async ({ filename, data }) => { const b = new Blob([data], { type: "text/csv;charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } };
    const sair = async () => { try { await msalApp.logoutPopup({ account }); } catch(e){} location.reload(); };
    return { db, user, downloads, sair, conta: { email, nome: account.name } };
  };
})();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function copy(text){ const ok=()=>toast("Copiado para a área de transferência"); try{ navigator.clipboard.writeText(text).then(ok,()=>fallbackCopy(text)); }catch(e){ fallbackCopy(text); } }
function fallbackCopy(text){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Copiado");}catch(e){toast("Selecione e copie manualmente");} ta.remove(); }

// ---------- data ----------
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(S.sols.map(s=>s.solicitanteId).concat(S.detailEvents.map(e=>e.por)).filter(Boolean))];
  if(!ids.length) return;
  try{ const ps=await S.user.profiles(ids); let ch=false; for(const id of ids){ const n=ps[id]&&ps[id].name; if(n && S.names[id]!==n){ S.names[id]=n; ch=true; } } if(ch) render(); }catch(e){}
}
function onData(){ if(S.dirty){ S.pendingRender=true; renderTabs(); return; } render(); }

async function boot(){
  render();
  const c = window.claude;
  let db=null, user=null;
  if(window.portalSharePoint){ try{ const sp=await window.portalSharePoint(); db=sp.db; user=sp.user; S.downloads=sp.downloads; S.sair=sp.sair; S.conta=sp.conta; }catch(e){ console.error(e); showBanner("Não foi possível conectar ao SharePoint: "+(e.message||e)+". Confira a configuração no início do arquivo."); } }
  else { try{ [db,user] = await Promise.all([c?.use?.("db") ?? null, c?.use?.("user") ?? null]); }catch(e){} }
  S.user=user;
  if(user){ try{ const me=await user.me(); S.me=me.id; S.canEdit=!!me.canEdit; S.canWrite=await user.can("data.write"); if(me.name&&me.id) S.names[me.id]=me.name; }catch(e){} }
  if(!db && window.portalSharePoint){ $("#main").innerHTML=`<div class="empty"><h3>Não foi possível conectar ao SharePoint</h3><p>Veja a mensagem acima. Confira a configuração no início do arquivo e se a pasta Portal_Unico existe no SharePoint.</p></div>`; return; }
  if(!db){
    S.demo=true; S.canEdit=true; S.portais=clone(DEMO.portais); S.areas=clone(DEMO.areas); S.ready=true;
    showBanner("Modo demonstração: este navegador não está conectado ao banco do portal. Nada do que for registrado aqui será salvo.");
    render(); return;
  }
  S.db=db;
  db.doc("config/catalogo").onSnapshot(snap=>{ const d=snap.exists?snap.data():{}; S.portais=Array.isArray(d.portais)?d.portais:[]; onData(); }, err=>showBanner("Não foi possível carregar a configuração de portais. Recarregue a página."));
  db.collection("config/catalogo/estoque").onSnapshot(qs=>{ S.estoque=qs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),"pt-BR")); onData(); },()=>{});
  db.collection("config/catalogo/areas").onSnapshot(qs=>{ S.areas=qs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ordem||99)-(b.ordem||99)||a.nome.localeCompare(b.nome)); S.ready=true; onData(); }, err=>showBanner("Não foi possível carregar o catálogo de demandas. Recarregue a página."));
  db.collection("solicitacoes").orderBy("criadoEm","desc").limit(1000).onSnapshot(qs=>{ S.sols=qs.docs.map(d=>({id:d.id,...d.data()})); if(S.detail){ const f=S.sols.find(s=>s.id===S.detail); if(!f) closeDetail(); } onData(); resolveNames(); }, err=>showBanner("Não foi possível carregar as solicitações. Recarregue a página."));
}
function showBanner(t){ $("#bannerText").textContent=t; $("#banner").hidden=false; }

const TABS=[["nova","Nova solicitação"],["lista","Solicitações"],["painel","Painel"],["integracao","Integração"],["catalogo","Catálogo"]];
function renderTabs(){
  const uc=document.getElementById("userchip"); if(uc&&S.conta) uc.innerHTML=`<span class="muted" style="font-size:12.5px">${esc(S.conta.nome||S.conta.email)}</span> <button class="btn ghost sm" data-act="sair">Sair</button>`;
  const abertas=S.sols.filter(s=>s.status==="Nova").length;
  $("#tabs").innerHTML=TABS.filter(([k])=>k!=="catalogo"||S.canEdit).map(([k,l])=>`<button class="tab" data-act="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':""}>${l}${k==="lista"&&abertas?`<span class="n">${abertas}</span>`:""}</button>`).join("");
}
function render(){
  renderTabs();
  const m=$("#main");
  if(!S.ready && !S.demo){ m.innerHTML=`<div class="empty"><h3>Carregando o portal…</h3><p>Buscando o catálogo de áreas e as solicitações registradas.</p></div>`; return; }
  const fn={nova:vNova,lista:vLista,painel:vPainel,integracao:vIntegracao,catalogo:vCatalogo}[S.tab]||vNova;
  m.innerHTML=fn();
  renderDetail();
}

const guiaAlvoOk=to=>{ const a=areaById(to[0]); return a&&a.ativo!==false&&(a.tipos||[]).some(t=>t.id===to[1]&&t.ativo!==false); };
const guiaOpcaoOk=o=>o.to?guiaAlvoOk(o.to):(GUIA[o.n]&&GUIA[o.n].o.some(guiaOpcaoOk));

// ----- Nova -----
function vNova(){
  const n=S.nova;
  if(n.done) return `<div class="panel success"><span class="eyebrow">Solicitação registrada</span><div class="proto">${esc(n.done.protocolo)}</div><h2>${esc(n.done.titulo)}</h2><p class="muted" style="margin:0">${esc(n.done.areaNome)} › ${esc(n.done.tipoNome)} · prazo de atendimento ${fmtD(n.done.prazo)} · destino: ${esc(portalNome(n.done.portal))}</p><div class="row" style="margin-top:8px"><button class="btn" data-act="open" data-v="${esc(n.done.id)}">Ver solicitação</button><button class="btn primary" data-act="nova-reset">Registrar outra</button></div></div>`;
  const area=areaById(n.areaId); const tipo=area&&(area.tipos||[]).find(t=>t.id===n.tipoId);
  const step=!area?1:!tipo?2:3;
  if(step===1 && n.modo==="guia" && S.areas.length) return vGuia();
  const st=(i,l,act)=>`<span class="s ${step===i?"on":step>i?"done":""}">${step>i&&act?`<button data-act="${act}"><i>${i}</i>${l}</button>`:`<i>${i}</i>${l}`}</span>`;
  let h=`<div class="page-head"><div><span class="eyebrow">Abrir demanda</span><h1>${step===1?"Para qual área é a sua solicitação?":step===2?esc(area.nome)+": qual é o tipo de demanda?":esc(tipo.nome)}</h1><p>${step===1?"Escolha a área responsável. As próximas opções e o formulário mudam conforme a escolha.":step===2?esc(area.descricao||""):esc(tipo.descricao||"")}</p></div></div>
  <div class="steps">${st(1,"Área","nova-area")}<span class="sep"></span>${st(2,"Tipo de demanda","nova-tipo")}<span class="sep"></span>${st(3,"Formulário")}</div>${n.viaGuia&&step===3?`<div class="via-guia">✓ Direcionado pelas suas respostas: <b>${esc(area.nome)} › ${esc(tipo.nome)}</b> · <button data-act="guia-refazer">Não é isso? Refazer perguntas</button></div>`:""}`;
  if(step===1){
    const areas=S.areas.filter(a=>a.ativo!==false && (a.tipos||[]).some(t=>t.ativo!==false));
    if(!areas.length) return h+`<div class="empty"><h3>Nenhuma área configurada ainda</h3><p>${S.canEdit?"Cadastre as áreas, os tipos de demanda e os campos de cada formulário no Catálogo.":"O responsável pelo portal ainda está configurando as áreas. Volte em breve."}</p>${S.canEdit?`<button class="btn primary" data-act="tab" data-v="catalogo">Abrir Catálogo</button>`:""}</div>`;
    return h+`<div class="grid-areas">${areas.map(a=>{const tt=(a.tipos||[]).filter(t=>t.ativo!==false);return `<button class="area-card" style="--c:${esc(a.cor||"#1e3c62")}" data-act="pick-area" data-v="${esc(a.id)}"><span class="top"><span class="area-ico">${icoArea(a)}</span><span class="sig">${esc(a.sigla||a.nome.slice(0,3).toUpperCase())}</span></span><h3>${esc(a.nome)}</h3><p>${esc(a.descricao||"")}</p><span class="meta">${tt.length} tipo${tt.length>1?"s":""} de demanda</span></button>`;}).join("")}</div>`;
  }
  if(step===2){
    const tipos=(area.tipos||[]).filter(t=>t.ativo!==false);
    return h+`<div class="type-list">${tipos.map(t=>`<button class="type-card" data-act="pick-tipo" data-v="${esc(t.id)}"><b>${esc(t.nome)}</b><p>${esc(t.descricao||"")}</p><span class="tags"><span class="chip sla">SLA ${+t.sla||0} dia${(+t.sla||0)===1?"":"s"}</span><span class="chip portal"><span class="dot"></span>${esc(portalNome(t.portal))}</span><span class="chip">${(t.campos||[]).length} campos específicos</span></span></button>`).join("")}</div>`;
  }
  const d=S.draft, e=S.errors;
  const fe=k=>e[k]?`<span class="errmsg">${esc(e[k])}</span>`:"";
  const campo=c=>{
    const id="c__"+c.id, v=d[id]??"", req=c.obrigatorio?'<span class="req">*</span>':"";
    let input;
    if(c.tipo==="texto_longo") input=`<textarea id="${id}" data-draft>${esc(v)}</textarea>`;
    else if(c.tipo==="lista") input=`<select id="${id}" data-draft><option value="">Selecione…</option>${(c.opcoes||[]).map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if(c.tipo==="sim_nao") input=`<select id="${id}" data-draft><option value="">Selecione…</option><option value="sim" ${v==="sim"?"selected":""}>Sim</option><option value="nao" ${v==="nao"?"selected":""}>Não</option></select>`;
    else if(c.tipo==="estoque"){
      if(!S.estoque.length) input=`<input type="text" id="${id}" value="${esc(v)}" data-draft placeholder="Descreva o item"><span class="hint">A lista de itens do estoque ainda não foi carregada no Catálogo.</span>`;
      else { const ek=empKeyOf(d["c__empresa-faturamento"]), temEmp=(tipo.campos||[]).some(x=>x.id==="empresa-faturamento");
        const okIt=it=>!ek||!it.cods||!Object.keys(it.cods).length||!!it.cods[ek];
        const grps=S.estoque.map(x=>({...x,itens:(x.itens||[]).filter(okIt)})).filter(x=>x.itens.length);
        const gid=d[id+"__g"]||"", g=grps.find(x=>x.id===gid), its=g?g.itens:[];
        if(temEmp&&!ek){ input=`<select id="${id}" disabled><option>Escolha primeiro a empresa de faturamento</option></select>`; } else {
        input=`<div class="est"><select id="${id}__g" data-draft data-est="${id}" aria-label="Grupo"><option value="">Selecione o grupo…</option>${grps.map(x=>`<option value="${esc(x.id)}" ${x.id===gid?"selected":""}>${esc(x.nome)} (${x.itens.length})</option>`).join("")}</select>
        <div class="col">${its.length>20?`<input type="text" data-estq="${id}" placeholder="Filtrar ${its.length} itens do grupo…" aria-label="Filtrar itens">`:""}<select id="${id}" data-draft ${g?"":"disabled"} aria-label="Item"><option value="">${g?"Selecione o item…":"Escolha o grupo primeiro"}</option>${its.map(it=>{const l=itemLabel(it), cd=ek&&it.cods?it.cods[ek]:"";return `<option value="${esc(l)}" ${l===v?"selected":""}>${esc(l)}${cd?" · "+esc(cd):""}</option>`;}).join("")}</select></div></div>`; } }
    }
    else if(c.tipo==="data") input=`<input type="date" id="${id}" value="${esc(v)}" data-draft>`;
    else if(c.tipo==="numero"||c.tipo==="moeda") input=`<input type="number" step="${c.tipo==="moeda"?"0.01":"any"}" min="0" id="${id}" value="${esc(v)}" data-draft ${c.tipo==="moeda"?'placeholder="0,00"':""}>`;
    else input=`<input type="text" id="${id}" value="${esc(v)}" data-draft>`;
    return `<div class="f ${c.tipo==="texto_longo"||c.tipo==="estoque"?"full":""} ${e[id]?"err":""}"><label for="${id}">${esc(c.label)}${req}</label>${input}${c.ajuda?`<span class="hint">${esc(c.ajuda)}</span>`:""}${fe(id)}</div>`;
  };
  return h+`<div class="form-shell"><form class="panel" id="formNova" novalidate>
    <h2>Dados gerais</h2><span class="muted" style="font-size:13px">Iguais para todas as demandas. É isso que padroniza a entrada para os portais.</span>
    <div class="fieldset">
      <div class="f full ${e.titulo?"err":""}"><label for="titulo">Título da solicitação<span class="req">*</span></label><input type="text" id="titulo" maxlength="120" value="${esc(d.titulo||"")}" placeholder="Resumo em uma linha" data-draft>${fe("titulo")}</div>
      <div class="f full ${e.unidade?"err":""}"><label for="unidade">Unidade<span class="req">*</span></label><select id="unidade" data-draft><option value="">Selecione…</option>${UNIDADES.map(x=>`<option ${d.unidade===x?"selected":""}>${x}</option>`).join("")}</select>${fe("unidade")}</div>
      <div class="f full"><label>Prioridade</label><div class="radio-row" role="radiogroup" aria-label="Prioridade">${PRIORIDADES.map(p=>`<label><input type="radio" name="prioridade" value="${p}" ${(d.prioridade||"Média")===p?"checked":""} data-draft><span>${p}</span></label>`).join("")}</div></div>
      <div class="f full ${e.descricao?"err":""}"><label for="descricao">Descrição<span class="req">*</span></label><textarea id="descricao" data-draft placeholder="Contexto, justificativa e o que você espera como resultado">${esc(d.descricao||"")}</textarea>${fe("descricao")}</div>
    </div>
    ${(tipo.campos||[]).length?`<hr class="divider"><h2 style="margin-top:14px">Informações de ${esc(tipo.nome.toLowerCase())}</h2><div class="fieldset">${tipo.campos.map(campo).join("")}</div>`:""}
    <div class="form-actions"><button type="button" class="btn ghost" data-act="nova-tipo">Voltar</button><button type="submit" class="btn primary" ${S.canWrite===false?"disabled":""}>Registrar solicitação</button></div>
    ${S.canWrite===false?`<p class="muted" style="text-align:right;font-size:12.5px">Seu acesso a este portal é somente leitura. Peça acesso de Colaborador ao responsável.</p>`:""}
  </form>
  <aside class="panel summary"><span class="eyebrow">Resumo</span><dl>
    <div><dt>Área</dt><dd>${esc(area.nome)}</dd></div><div><dt>Tipo de demanda</dt><dd>${esc(tipo.nome)}</dd></div>
    <div><dt>Prazo de atendimento (SLA)</dt><dd>${+tipo.sla||0} dias corridos · até ${fmtD(addDays(nowIso(),tipo.sla))}</dd></div>
    <div><dt>Portal de destino</dt><dd>${esc(portalNome(tipo.portal))}</dd></div>
    <div><dt>Solicitante</dt><dd>${esc(S.me?nm(S.me):"—")}</dd></div></dl></aside></div>`;
}

function readDraft(){ const f=$("#formNova"); if(!f) return; f.querySelectorAll("[data-draft]").forEach(el=>{ if(el.type==="radio"){ if(el.checked) S.draft[el.name]=el.value; } else S.draft[el.id]=el.value; }); }

async function submitNova(){
  readDraft();
  const area=areaById(S.nova.areaId), tipo=area&&(area.tipos||[]).find(t=>t.id===S.nova.tipoId); if(!tipo) return;
  const d=S.draft, e={};
  if(!(d.titulo||"").trim()) e.titulo="Informe um título.";
  if(!d.unidade) e.unidade="Selecione a unidade.";
  if(!(d.descricao||"").trim()) e.descricao="Descreva a solicitação.";
  const campos={}, itensEstoque={};
  (tipo.campos||[]).forEach(c=>{ const v=(d["c__"+c.id]??"").toString().trim(); if(c.obrigatorio && !v) e["c__"+c.id]="Campo obrigatório."; let val=v; if(c.tipo==="estoque"&&v){ const g=S.estoque.find(x=>x.id===d["c__"+c.id+"__g"]); if(g){ val=g.nome+" › "+v; const it=(g.itens||[]).find(x=>itemLabel(x)===v); itensEstoque[c.id]={grupo:g.nome,grupo_id:g.id,descricao:it?it.n:v,codigo:it&&it.c||null,unidade_medida:it&&it.u||null,codigos_por_empresa:it&&it.cods||{}}; } } campos[c.id]=val; });
  S.errors=e;
  if(Object.keys(e).length){ render(); const first=document.querySelector(".f.err input,.f.err select,.f.err textarea"); first&&first.focus(); toast("Preencha os campos destacados"); return; }
  const empKey=String(campos["empresa-faturamento"]||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim();
  if(empKey) Object.values(itensEstoque).forEach(ie=>{ const cs=ie.codigos_por_empresa||{}; ie.empresa_faturamento=empKey; ie.codigo=cs[empKey]||ie.codigo||null; });
  const criado=nowIso();
  const doc={ protocolo:protocolo(), criadoEm:criado, atualizadoEm:criado,
    areaId:area.id, areaNome:area.nome, tipoId:tipo.id, tipoNome:tipo.nome, portal:tipo.portal||"", sla:+tipo.sla||0, prazo:addDays(criado,tipo.sla),
    titulo:d.titulo.trim(), unidade:d.unidade, prioridade:d.prioridade||"Média", descricao:d.descricao.trim(),
    campos:{...campos,...Object.fromEntries((tipo.fixos||[]).map(f=>[f.id,f.valor]))}, itensEstoque, camposDef:(tipo.fixos||[]).map(f=>({id:f.id,label:f.label,tipo:"fixo"})).concat((tipo.campos||[]).map(c=>({id:c.id,label:c.label,tipo:c.tipo}))),
    solicitanteId:S.me||"", status:"Nova", responsavelId:"",
    integracao:{status: tipo.portal?"pendente":"nao_aplica", enviadoEm:"", refExterna:""} };
  const btn=document.querySelector("#formNova button[type=submit]"); if(btn){btn.disabled=true; btn.textContent="Registrando…";}
  try{
    let id;
    if(S.demo){ id="demo-"+Math.random().toString(36).slice(2,8); S.sols.unshift({id,...doc}); }
    else { const ref=S.db.collection("solicitacoes").doc(); id=ref.id; await ref.set(doc); await ref.collection("eventos").add({em:criado,por:S.me||"",tipo:"status",texto:"Solicitação aberta",status:"Nova"}); }
    S.nova.done={id,...doc}; S.draft={}; S.errors={}; S.dirty=false; render();
  }catch(err){ if(btn){btn.disabled=false; btn.textContent="Registrar solicitação";} toast(err&&err.code==="invalid_argument"?"Sem permissão para registrar. Peça acesso de Colaborador.":"Não foi possível registrar. Tente novamente."); }
}

// ----- Lista -----
function filtered(){
  const f=S.filt, q=f.q.trim().toLowerCase();
  return S.sols.filter(s=>{
    if(f.area && s.areaId!==f.area) return false;
    if(f.portal && (s.portal||"")!==f.portal) return false;
    if(f.status==="abertas" && FECHADOS.includes(s.status)) return false;
    if(f.status==="atrasadas" && !isLate(s)) return false;
    if(f.status && !["abertas","atrasadas"].includes(f.status) && s.status!==f.status) return false;
    if(f.escopo==="minhas" && s.solicitanteId!==S.me) return false;
    if(q && !(`${s.protocolo} ${s.titulo} ${s.tipoNome} ${s.areaNome} ${s.unidade||""}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

  <div class="filters">

    <select id="fstatus" aria-label="Status">${opt("abertas","Em aberto",f.status)}${opt("atrasadas","Atrasadas",f.status)}${opt("","Todos os status",f.status)}${STATUS.map(s=>opt(s,s,f.status)).join("")}</select>
    <select id="fportal" aria-label="Portal de destino">${opt("","Todos os portais",f.portal)}${S.portais.map(p=>opt(p.id,p.nome,f.portal)).join("")}</select>
    <div class="seg" role="group" aria-label="Escopo"><button data-act="escopo" data-v="todas" aria-pressed="${f.escopo==="todas"}">Todas</button><button data-act="escopo" data-v="minhas" aria-pressed="${f.escopo==="minhas"}">Minhas</button></div>
  </div>`;
  if(!S.sols.length) return h+`<div class="empty"><h3>Nenhuma solicitação registrada ainda</h3><p>As demandas abertas em "Nova solicitação" aparecem aqui, com protocolo, prazo e portal de destino.</p><button class="btn primary" data-act="tab" data-v="nova">Abrir a primeira solicitação</button></div>`;

// ----- Detail -----
function openDetail(id){
  S.detail=id; S.detailEvents=[]; if(S.unsubDetail){S.unsubDetail(); S.unsubDetail=null;}

function closeDetail(){ S.detail=null; if(S.unsubDetail){S.unsubDetail(); S.unsubDetail=null;} $("#overlay").innerHTML=""; }

     <dt>Área › Tipo</dt><dd>${esc(s.areaNome)} › ${esc(s.tipoNome)}</dd>

function renderEvents(){
  const tl=$("#tl"); if(!tl) return;
  const s=S.sols.find(x=>x.id===S.detail);
  const evs=S.demo?[{em:s.criadoEm,por:s.solicitanteId,tipo:"status",texto:"Solicitação aberta"}]:S.detailEvents;
  tl.innerHTML=evs.length?evs.map(e=>`<li class="${e.tipo==="status"?"st":""}"><div><div>${esc(e.texto)}</div><div class="w">${esc(nm(e.por))} · ${fmtDT(e.em)}</div></div></li>`).join(""):`<li><div class="w">Carregando histórico…</div></li>`;
}
async function setStatus(){
  const s=S.sols.find(x=>x.id===S.detail); const v=$("#dstatus").value; if(!s||v===s.status) return;
  const em=nowIso();
  try{
    if(S.demo){ s.status=v; s.atualizadoEm=em; }
    else { await S.db.doc(`solicitacoes/${s.id}`).update({status:v,atualizadoEm:em}); await S.db.collection(`solicitacoes/${s.id}/eventos`).add({em,por:S.me||"",tipo:"status",texto:`Status alterado de "${s.status}" para "${v}"`,status:v}); }
    toast("Status atualizado"); if(S.demo) render();
  }catch(e){ toast("Não foi possível alterar o status. Somente a equipe de atendimento (Editor) pode alterar."); }
}
async function addComment(){
  const t=$("#cmt").value.trim(); if(!t) return;
  try{
    if(S.demo){ toast("No modo demonstração os comentários não são salvos"); return; }
    await S.db.collection(`solicitacoes/${S.detail}/eventos`).add({em:nowIso(),por:S.me||"",tipo:"comentario",texto:t});
    $("#cmt").value=""; toast("Comentário registrado");
  }catch(e){ toast("Não foi possível registrar o comentário."); }
}
function payload(s){
  const campos={}; (s.camposDef||[]).forEach(c=>campos[c.id]={rotulo:c.label,tipo:c.tipo,valor:(s.campos||{})[c.id]??"",...((s.itensEstoque||{})[c.id]?{item_estoque:s.itensEstoque[c.id]}:{})});
  return { protocolo:s.protocolo, criado_em:s.criadoEm, status:s.status, prioridade:s.prioridade, prazo:s.prazo,
    area:{id:s.areaId,nome:s.areaNome}, tipo_demanda:{id:s.tipoId,nome:s.tipoNome},
    portal_destino:{id:s.portal||null,nome:s.portal?portalNome(s.portal):null},
    solicitante:{id:s.solicitanteId||null,nome:s.solicitanteId?nm(s.solicitanteId):null},
    unidade:s.unidade||null, titulo:s.titulo, descricao:s.descricao, campos };
}

// ----- Painel -----
function vPainel(){
  const all=S.sols, open=all.filter(s=>!FECHADOS.includes(s.status)), late=open.filter(isLate);
  const d30=Date.now()-30*864e5, done30=all.filter(s=>s.status==="Concluída"&&new Date(s.atualizadoEm).getTime()>=d30);
  const group=(arr,key)=>{ const m=new Map(); arr.forEach(s=>{const k=key(s); m.set(k,(m.get(k)||0)+1);}); return [...m.entries()].sort((a,b)=>b[1]-a[1]); };
  const bars=(rows,cls="")=>{ const mx=Math.max(1,...rows.map(r=>r[1])); return rows.length?`<div class="bars">${rows.map(([k,v])=>`<div class="bar-row"><span title="${esc(k)}">${esc(k)}</span><span class="bar ${cls}"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><b>${v}</b></div>`).join("")}</div>`:`<p class="muted" style="margin:12px 0 0">Sem dados ainda.</p>`; };
  let h=`<div class="page-head"><div><span class="eyebrow">Visão geral</span><h1>Painel de demandas</h1><p>Volume, atrasos e distribuição por área e por portal de destino.</p></div></div>
  <div class="kpis"><div class="kpi"><span class="d">Total registradas</span><div class="v">${all.length}</div></div><div class="kpi"><span class="d">Em aberto</span><div class="v">${open.length}</div></div><div class="kpi"><span class="d">Com prazo vencido</span><div class="v ${late.length?"crit":""}">${late.length}</div></div><div class="kpi"><span class="d">Concluídas em 30 dias</span><div class="v">${done30.length}</div></div></div>`;
  if(!all.length) return h+`<div class="empty"><h3>O painel começa a encher com a primeira solicitação</h3><p>Assim que o time registrar demandas, os gráficos por área, status e portal aparecem aqui.</p></div>`;
  return h+`<div class="dash">
   <div class="panel"><h2>Em aberto por área</h2>${bars(group(open,s=>s.areaNome))}</div>
   <div class="panel"><h2>Por status</h2>${bars(STATUS.map(st=>[st,all.filter(s=>s.status===st).length]).filter(r=>r[1]),"accent")}</div>
   <div class="panel"><h2>Por portal de destino</h2>${bars(group(all,s=>portalNome(s.portal)))}</div>
   <div class="panel"><h2>Tipos mais solicitados</h2>${bars(group(all,s=>s.tipoNome).slice(0,8),"accent")}</div></div>`;
}

// ----- Integração -----
function vIntegracao(){
  const pend=p=>S.sols.filter(s=>(s.portal||"")===p && s.integracao && s.integracao.status==="pendente");

function parseEstoque(rows){
  rows=rows.map(r=>r.map(x=>String(x??"").trim())).filter(r=>r.some(Boolean));
  if(!rows.length) return null;
  let hi=-1, col={g:0,c:1,n:2,u:3};
  for(let i=0;i<Math.min(6,rows.length);i++){ const h=rows[i].map(x=>x.toLowerCase()); const gi=h.findIndex(x=>/grupo|fam[ií]lia|categoria/.test(x)); const ni=h.findIndex(x=>/^item|descri|produto|material/.test(x));
    if(gi>=0&&ni>=0){ hi=i; col={g:gi,n:ni,c:h.findIndex(x=>/c[óo]d/.test(x)),u:h.findIndex(x=>/^un|unid|medida/.test(x))}; break; } }
  if(hi<0 && rows[0].length===2) col={g:0,c:-1,n:1,u:-1};
  const map=new Map(); let total=0;
  rows.slice(hi+1).forEach(r=>{ const g=r[col.g], n=r[col.n]; if(!g||!n) return; const it={c:col.c>=0?r[col.c]||"":"",n,u:col.u>=0?r[col.u]||"":""};
    if(!map.has(g)) map.set(g,new Map()); const k=(it.c+"|"+it.n).toLowerCase(); if(!map.get(g).has(k)){ map.get(g).set(k,it); total++; } });
  const grupos=[...map.entries()].map(([nome,m])=>({nome,itens:[...m.values()].sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"))})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  return grupos.length?{grupos,total}:null;
}
async function previewEstoque(){
  const r=document.querySelector('input[name=estMode]:checked'); if(r) S.cat.estMode=r.value;
  const f=$("#estFile").files[0], txt=$("#estPaste").value; let rows=null;
  try{
    if(f){ if(/\.(xlsx|xls)$/i.test(f.name)){ if(!window.XLSX){ toast("Leitor de Excel não carregou. Salve como CSV ou cole o conteúdo."); return; } const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}); }
      else { const t=await f.text(); rows=splitText(t); } }
    else if(txt.trim()) rows=splitText(txt);
    else { toast("Escolha um arquivo ou cole a lista"); return; }
  }catch(e){ toast("Não foi possível ler o arquivo."); return; }
  const pv=parseEstoque(rows); if(!pv){ toast("Nenhum item encontrado. Confira se há colunas Grupo e Item."); return; }
  S.cat.estPreview=pv; render();
}
function splitText(t){ const ls=t.replace(/\r/g,"").split("\n"); const d=ls[0].includes("\t")?"\t":ls[0].includes(";")?";":","; return ls.map(l=>l.split(d)); }
async function saveEstoque(){
  const pv=S.cat.estPreview; if(!pv) return; const repl=S.cat.estMode==="substituir";
  const existing=new Map(S.estoque.map(g=>[g.id,g])); const keep=new Set();
  try{
    for(const g of pv.grupos){ const id=slug(g.nome); keep.add(id); let itens=g.itens;
      if(!repl && existing.has(id)){ const m=new Map((existing.get(id).itens||[]).map(it=>[(it.c+"|"+it.n).toLowerCase(),it])); itens.forEach(it=>m.set((it.c+"|"+it.n).toLowerCase(),it)); itens=[...m.values()].sort((a,b)=>a.n.localeCompare(b.n,"pt-BR")); }
      if(S.demo){ const i=S.estoque.findIndex(x=>x.id===id); const o={id,nome:g.nome,itens}; if(i>=0) S.estoque[i]=o; else S.estoque.push(o); }
      else await S.db.doc(`config/catalogo/estoque/${id}`).set({nome:g.nome,itens}); }
    if(repl) for(const id of existing.keys()) if(!keep.has(id)){ if(S.demo) S.estoque=S.estoque.filter(x=>x.id!==id); else await S.db.doc(`config/catalogo/estoque/${id}`).delete(); }
    toast(`Estoque importado: ${pv.grupos.length} grupos · ${pv.total} itens`); S.cat.estPreview=null; S.cat.estOpen=false; S.dirty=false; render();
  }catch(e){ toast("Não foi possível salvar a lista. Somente Editores alteram o catálogo."); }
}

  const listaVazia=(t.campos||[]).find(c=>c.tipo==="lista"&&!(c.opcoes||[]).length); if(listaVazia){ toast(`Informe as opções da lista "${listaVazia.label}"`); return; }
  const used=new Set(); (t.campos||[]).forEach(c=>{ if(!c.id){ let b=slug(c.label), id=b, k=2; while(used.has(id)) id=b+"-"+(k++); c.id=id; } used.add(c.id); });
  const tipo={id:t.id||slug(t.nome),nome:t.nome.trim(),descricao:t.descricao.trim(),sla:t.sla,portal:t.portal,ativo:t.ativo,...(t.fixos?{fixos:t.fixos}:{}),campos:t.campos.map(c=>({id:c.id,label:c.label.trim(),tipo:c.tipo,obrigatorio:!!c.obrigatorio,...(c.tipo==="lista"?{opcoes:c.opcoes}:{})}))};
  area.tipos=area.tipos||[];
  if(t._novo){ let id=tipo.id,k=2; while(area.tipos.some(x=>x.id===id)) id=tipo.id+"-"+(k++); tipo.id=id; area.tipos.push(tipo); }
  else area.tipos[t._idx]=tipo;
  try{ await saveAreaDoc(area); S.cat.tipoDraft=null; S.dirty=false; toast("Tipo de demanda salvo"); render(); }catch(e){ toast("Não foi possível salvar. Somente Editores alteram o catálogo."); }
}
async function saveArea(){
  readArea(); const a=S.cat.areaDraft; if(!a.nome.trim()){ toast("Dê um nome à área"); return; }
  const out={...a,nome:a.nome.trim()};
  if(a._novo){ let id=slug(a.nome),k=2; while(S.areas.some(x=>x.id===id)) id=slug(a.nome)+"-"+(k++); out.id=id; out.tipos=[]; }
  try{ await saveAreaDoc(out); S.cat.areaId=out.id; S.cat.areaDraft=null; S.dirty=false; toast("Área salva"); render(); }catch(e){ toast("Não foi possível salvar. Somente Editores alteram o catálogo."); }
}
function readPortais(){ S.portais.forEach((p,i)=>{ const n=$("#pn_"+i); if(n){ p.nome=n.value; p.descricao=$("#pd_"+i).value; p.url=$("#pu_"+i).value.trim(); } }); }
async function savePortais(){
  readPortais(); if(S.portais.some(p=>!p.nome.trim())){ toast("Todo portal precisa de um nome"); return; }
  if(S.portais.some(p=>p.url && !/^https?:\/\//i.test(p.url))){ toast("O endereço do portal deve começar com https://"); return; }
  try{ if(!S.demo) await S.db.doc("config/catalogo").set({portais:S.portais.map(p=>({id:p.id,nome:p.nome.trim(),descricao:(p.descricao||"").trim(),url:p.url||""}))}); S.dirty=false; toast("Portais salvos"); render(); }catch(e){ toast("Não foi possível salvar os portais."); }
}

// ----- CSV -----
async function exportCsv(){
  const rows=filtered(); if(!rows.length){ toast("Nada para exportar com esses filtros"); return; }
  const head=["Protocolo","Aberta em","Área","Tipo","Título","Unidade","Prioridade","Status","Prazo","Portal de destino","Integração","Solicitante","Descrição","Campos específicos"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[head.map(q).join(";")].concat(rows.map(s=>[s.protocolo,fmtDT(s.criadoEm),s.areaNome,s.tipoNome,s.titulo,s.unidade||s.empresa,s.prioridade,s.status,fmtD(s.prazo),portalNome(s.portal),s.integracao?s.integracao.status:"",nm(s.solicitanteId),s.descricao,(s.camposDef||[]).map(c=>`${c.label}: ${campoValor(c,(s.campos||{})[c.id])}`).join(" | ")].map(q).join(";")));
  const csv="﻿"+lines.join("\r\n");
  let dl=S.downloads||null; if(!dl){ try{ dl=await window.claude?.use?.("downloads"); }catch(e){} }
  if(!dl){ copy(csv); toast("Download indisponível aqui. CSV copiado para colar no Excel."); return; }
  try{ await dl.save({filename:`solicitacoes_${new Date().toISOString().slice(0,10)}.csv`,data:csv}); }catch(e){ if(e&&e.code!=="cancelled"&&e.code!=="declined") toast("Não foi possível gerar o arquivo."); }
}

// ---------- events ----------
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  const leaveForm=()=>{ S.dirty=false; if(S.pendingRender){S.pendingRender=false;} };
  switch(a){
    case "tab": S.tab=v; S.cat.tipoDraft=null; S.cat.areaDraft=null; leaveForm(); if(v==="nova"&&S.nova.done) S.nova={areaId:null,tipoId:null,done:null}; render(); window.scrollTo(0,0); break;
    case "guia": { const path=S.nova.path||[], nodeId=path.length?path[path.length-1].n:"inicio", o=(GUIA[nodeId]||GUIA.inicio).o[+v]; if(!o) break;
      if(o.to){ S.nova.areaId=o.to[0]; S.nova.tipoId=o.to[1]; S.nova.viaGuia=true; S.errors={}; render(); window.scrollTo(0,0); const f=$("#titulo"); f&&f.focus(); }
      else { S.nova.path=path.concat([{n:o.n,t:o.t}]); render(); } break; }
    case "guia-voltar": S.nova.path=(S.nova.path||[]).slice(0,-1); render(); break;
    case "guia-ir": S.nova.path=(S.nova.path||[]).slice(0,+v); render(); break;
    case "guia-refazer": readDraft(); S.nova={areaId:null,tipoId:null,done:null,path:[]}; leaveForm(); render(); window.scrollTo(0,0); break;
    case "modo-areas": S.nova.modo="areas"; render(); break;
    case "modo-guia": S.nova.modo="guia"; S.nova.path=[]; render(); break;
    case "pick-area": S.nova.areaId=v; S.nova.viaGuia=false; S.nova.tipoId=null; render(); break;
    case "pick-tipo": S.nova.tipoId=v; S.errors={}; render(); const f=$("#titulo"); f&&f.focus(); break;
    case "nova-area": readDraft(); S.nova.areaId=null; S.nova.tipoId=null; leaveForm(); render(); break;
    case "nova-tipo": readDraft(); S.nova.tipoId=null; leaveForm(); render(); break;
    case "nova-reset": S.nova={areaId:null,tipoId:null,done:null}; render(); break;
    case "open": openDetail(v); break;
    case "close": closeDetail(); break;
    case "set-status": setStatus(); break;
    case "copy-payload": { const s=S.sols.find(x=>x.id===S.detail); s&&copy(JSON.stringify(payload(s),null,2)); break; }
    case "copy-pend": copy(JSON.stringify(S.sols.filter(s=>(s.portal||"")===v&&s.integracao&&s.integracao.status==="pendente").map(payload),null,2)); break;
    case "copy-schema": copy($("main pre.code").textContent); break;
    case "mark-sent": markSent(v); break;
    case "escopo": S.filt.escopo=v; render(); break;
    case "csv": exportCsv(); break;
    case "sair": if(S.sair) S.sair(); break;
    case "cat-area": S.cat.areaId=v; S.cat.areaDraft=null; leaveForm(); render(); break;
    case "area-new": S.cat.areaDraft={_novo:true,nome:"",sigla:"",descricao:"",cor:CORES[S.areas.length%CORES.length],ordem:S.areas.length+1,ativo:true}; render(); $("#an")&&$("#an").focus(); break;
    case "area-edit": S.cat.areaDraft=clone(areaById(S.cat.areaId)); render(); break;
    case "area-cancel": S.cat.areaDraft=null; leaveForm(); render(); break;
    case "area-del": $("#areaDelConfirm").hidden=false; break;
    case "area-del-ok": try{ if(S.demo) S.areas=S.areas.filter(x=>x.id!==S.cat.areaId); else await S.db.doc(`config/catalogo/areas/${S.cat.areaId}`).delete(); S.cat.areaDraft=null; S.cat.areaId=null; leaveForm(); toast("Área excluída"); render(); }catch(e){ toast("Não foi possível excluir."); } break;
    case "tipo-new": S.cat.tipoDraft={_novo:true,nome:"",descricao:"",sla:5,portal:"",ativo:true,campos:[]}; render(); $("#tn")&&$("#tn").focus(); break;
    case "tipo-edit": { const ar=areaById(S.cat.areaId); S.cat.tipoDraft={...clone(ar.tipos[+v]),_idx:+v}; render(); break; }
    case "tipo-cancel": S.cat.tipoDraft=null; leaveForm(); render(); break;
    case "tipo-del": $("#tipoDelConfirm").hidden=false; break;
    case "tipo-del-ok": { const ar=clone(areaById(S.cat.areaId)); ar.tipos.splice(S.cat.tipoDraft._idx,1); try{ await saveAreaDoc(ar); S.cat.tipoDraft=null; leaveForm(); toast("Tipo excluído"); render(); }catch(e){ toast("Não foi possível excluir."); } break; }
    case "campo-add": readTipo(); S.cat.tipoDraft.campos.push({label:"",tipo:"texto",obrigatorio:false}); S.dirty=true; render(); { const i=S.cat.tipoDraft.campos.length-1; $("#cl_"+i)&&$("#cl_"+i).focus(); } break;
    case "campo-del": readTipo(); S.cat.tipoDraft.campos.splice(+v,1); S.dirty=true; render(); break;
    case "campo-up": case "campo-down": { readTipo(); const cs=S.cat.tipoDraft.campos, i=+v, j=a==="campo-up"?i-1:i+1; [cs[i],cs[j]]=[cs[j],cs[i]]; S.dirty=true; render(); break; }
    case "portal-add": readPortais(); S.portais.push({id:"portal-"+Math.random().toString(36).slice(2,7),nome:"",descricao:"",url:""}); S.dirty=true; render(); { const i=S.portais.length-1; $("#pn_"+i)&&$("#pn_"+i).focus(); } break;
    case "portal-del": readPortais(); S.portais.splice(+v,1); S.dirty=true; render(); toast("Clique em Salvar portais para confirmar"); break;
    case "portal-save": savePortais(); break;
    case "est-toggle": S.cat.estOpen=!S.cat.estOpen; S.cat.estPreview=null; render(); break;
    case "est-preview": previewEstoque(); break;
    case "est-save": saveEstoque(); break;
    case "est-del": S.cat.estDel=v; render(); break;
    case "est-del-ok": try{ if(S.demo) S.estoque=S.estoque.filter(x=>x.id!==v); else await S.db.doc(`config/catalogo/estoque/${v}`).delete(); S.cat.estDel=null; toast("Grupo removido"); render(); }catch(e){ toast("Não foi possível remover."); } break;
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape" && S.detail) closeDetail();
  if(ev.key==="Enter" && ev.target.matches("tr[data-act=open]")) openDetail(ev.target.dataset.v);
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  const id=ev.target.id;
  if(id==="formNova") submitNova(); else if(id==="formCmt") addComment(); else if(id==="formTipo") saveTipo(); else if(id==="formArea") saveArea();
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.matches("[data-draft],[data-dirty],#portais input")) S.dirty=true;
  if(t.matches("[data-estq]")){ const q=t.value.trim().toLowerCase(), sel=document.getElementById(t.dataset.estq); if(sel) [...sel.options].forEach((o,i)=>{ if(i) o.hidden=q&&!o.textContent.toLowerCase().includes(q); }); return; }
  if(t.id==="fq"){ S.filt.q=t.value; const pos=t.selectionStart; render(); const n=$("#fq"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="c__empresa-faturamento"){ readDraft(); Object.keys(S.draft).filter(k=>k.endsWith("__g")).forEach(k=>{ S.draft[k]=""; S.draft[k.slice(0,-3)]=""; }); S.dirty=true; render(); return; }
  if(t.matches("[data-est]")){ readDraft(); S.draft[t.dataset.est]=""; S.dirty=true; render(); const n=document.getElementById(t.dataset.est); n&&!n.disabled&&n.focus(); return; }
  if(t.id==="farea"){S.filt.area=t.value; render();}
  else if(t.id==="fstatus"){S.filt.status=t.value; render();}
  else if(t.id==="fportal"){S.filt.portal=t.value; render();}
});

boot();
})();
</script>
